[project]
name = "course-catalog-map"
version = "0.1.0"
description = "Interactive semantic map of every course in a university catalog, starting with Stanford"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=16",
    # numba (via umap-learn) caps numpy; pin explicitly so the resolver does not
    # backtrack to an old numba that cannot build on modern Python.
    "numpy>=1.26,<2.3",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "umap-learn>=0.5.10",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "toponymy>=0.5.4",
    "evoc>=0.3",  # EVoCClusterer: clusters the embeddings directly, no 2-d constraint (post-hoc structure analysis)
    "datamapplot>=0.7.3",  # 0.7.3 pins deck.gl 9.1; earlier versions load deck.gl@latest, which breaks initial label render
    "glasbey>=0.2",
    "anthropic>=0.40",
    "joblib>=1.3",
    "nest-asyncio>=1.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14",
    "pytest>=8.0",
    "plotly>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E501"]  # print-heavy analysis scripts

[tool.ruff.lint.isort]
# Stage scripts run with pipeline/ as sys.path[0], so these are local modules, not third-party.
known-first-party = ["config", "io_utils", "sources", "embedder", "remote", "compare_embeddings"]
